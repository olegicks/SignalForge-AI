name: Daily pipeline

on:
  schedule:
    # 05:17 UTC, Monday to Friday. Off the top of the hour, when GitHub delays
    # scheduled runs the most. A late run is still safe: prices use completed sessions only.
    - cron: "17 5 * * 1-5"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Optional comma-separated subset, e.g. AAPL,MSFT"
        required: false
        default: ""

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      # Optional and not sensitive: read from repository Variables, or from Secrets if stored there.
      OPENAI_PRICE_INPUT_PER_1M: ${{ vars.OPENAI_PRICE_INPUT_PER_1M || secrets.OPENAI_PRICE_INPUT_PER_1M }}
      OPENAI_PRICE_OUTPUT_PER_1M: ${{ vars.OPENAI_PRICE_OUTPUT_PER_1M || secrets.OPENAI_PRICE_OUTPUT_PER_1M }}
      OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || secrets.OPENAI_REASONING_EFFORT }}
      # Embeddings for "Ask the news". Without OPENAI_EMBEDDING_MODEL the embed step is skipped.
      OPENAI_EMBEDDING_MODEL: ${{ vars.OPENAI_EMBEDDING_MODEL || secrets.OPENAI_EMBEDDING_MODEL }}
      EMBEDDING_DIM: ${{ vars.EMBEDDING_DIM || secrets.EMBEDDING_DIM }}
      OPENAI_EMBEDDING_PRICE_PER_1M: ${{ vars.OPENAI_EMBEDDING_PRICE_PER_1M || secrets.OPENAI_EMBEDDING_PRICE_PER_1M }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run pipeline
        env:
          TICKERS: ${{ github.event.inputs.tickers }}
        run: |
          if [ -n "$TICKERS" ]; then
            python -m pipeline.run --tickers "$TICKERS"
          else
            python -m pipeline.run
          fi
