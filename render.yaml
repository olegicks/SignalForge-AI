# Render Blueprint: one free web service for the API. The database is Neon, not Render.
services:
  - type: web
    name: signalforge-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # "/" does not touch the database, so health checks don't keep Neon's compute awake.
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Needed only by POST /ask ("Ask the news"); without them /ask answers 503.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: OPENAI_REASONING_EFFORT
        sync: false
      - key: OPENAI_EMBEDDING_MODEL
        sync: false
      - key: EMBEDDING_DIM
        value: "512"
      - key: OPENAI_PRICE_INPUT_PER_1M
        sync: false
      - key: OPENAI_PRICE_OUTPUT_PER_1M
        sync: false
      - key: OPENAI_EMBEDDING_PRICE_PER_1M
        sync: false
      - key: ASK_DAILY_LIMIT
        value: "200"
